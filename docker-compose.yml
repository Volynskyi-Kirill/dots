services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      - SERVER_PORT=8080
      - AXIOM_TOKEN=${AXIOM_TOKEN}
      - AXIOM_DATASET=${AXIOM_DATASET}
      - AXIOM_EDGE=${AXIOM_EDGE}

  frontend:
    build:
      context: ./tochky
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./tochky:/app
      - /app/node_modules
