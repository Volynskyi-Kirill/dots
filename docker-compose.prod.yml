services:
  backend:
    image: dots-game-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    networks:
      - dots-network

  frontend:
    image: dots-game-frontend-prod
    build:
      context: ./tochky
      dockerfile: Dockerfile.prod
    ports:
      - "80:3000"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dots-network

networks:
  dots-network:
    driver: bridge
